<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wartung">
<title>Wartungsübersicht – Elektro Krieg</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#1c2430;--surface:#242f3d;--surface2:#2c3a4d;--border:#3a4a5c;
  --text:#e8ecf1;--muted:#9aa1ab;--accent:#4a9eff;
  --ok:#2ecc71;--err:#e74c3c;--warn:#f1c40f;
  --radius:10px;--max:720px;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;
  min-height:100vh;padding-bottom:40px;}
a{color:inherit;text-decoration:none;}

/* HEADER */
.app-header{background:var(--surface);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
.app-header h1{font-size:1.1rem;font-weight:700;flex:1;letter-spacing:.3px;}
#syncStatus{font-size:.75rem;padding:3px 8px;border-radius:20px;background:var(--surface2);
  color:var(--muted);white-space:nowrap;}
#syncStatus.ok{color:var(--ok);}
#syncStatus.err{color:var(--err);}
#syncStatus.busy{color:var(--warn);}
#syncStatus.off{color:var(--muted);}
.icon-btn{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;
  padding:4px 6px;border-radius:6px;}
.icon-btn:hover{background:var(--surface2);color:var(--text);}

/* TABS */
.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);}
.tab-btn{flex:1;padding:11px;font-size:.9rem;font-weight:600;background:none;border:none;
  color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:.15s;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* CONTROLS */
.plan-controls{padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  background:var(--surface);border-bottom:1px solid var(--border);}
.year-sel{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:6px 10px;border-radius:8px;font-size:.9rem;cursor:pointer;}
.q-tabs{display:flex;gap:4px;}
.q-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;transition:.15s;}
.q-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.filter-toggle{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);
  margin-left:auto;cursor:pointer;}
.filter-toggle input{cursor:pointer;width:15px;height:15px;}

/* MAIN CONTENT */
.main{max-width:var(--max);margin:0 auto;padding:12px 10px;}

/* ORT GROUP */
.ort-group{margin-bottom:4px;}
.ort-label{font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.8px;
  text-transform:uppercase;padding:10px 4px 4px;}

/* KUNDE CARD */
.kunde-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;margin-bottom:8px;transition:.15s;}
.kunde-card.all-done{border-color:#2ecc71;background:rgba(46,204,113,.06);}
.kunde-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.kunde-name{font-weight:600;font-size:.95rem;flex:1;}
.kunde-zusatz{font-size:.8rem;color:var(--muted);}
.btn-pruef{background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  padding:4px 10px;border-radius:6px;font-size:.78rem;cursor:pointer;white-space:nowrap;
  text-decoration:none;display:inline-block;transition:.15s;}
.btn-pruef:hover{border-color:var(--accent);color:var(--accent);}
.gewerk-badges{display:flex;flex-wrap:wrap;gap:6px;}

/* GEWERK BADGE */
.gw-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;
  border-radius:20px;font-size:.8rem;font-weight:600;cursor:pointer;
  border:2px solid transparent;transition:.15s;user-select:none;}
.gw-badge.offen{background:var(--surface2);border-color:var(--border);color:var(--text);}
.gw-badge.offen:hover{border-color:var(--accent);}
.gw-badge.rollover{border-style:dashed;}
.gw-badge.done{color:#fff;}
.gw-badge.done::before{content:'✓ ';}
.gw-badge sup{font-size:.65em;font-weight:700;margin-left:1px;}

/* EMPTY */
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state .big{font-size:2rem;margin-bottom:8px;}

/* STAMMDATEN */
.stamm-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.stamm-search{flex:1;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:10px 14px;border-radius:var(--radius);font-size:.9rem;}
.stamm-search::placeholder{color:var(--muted);}
.btn-add-kunde{background:var(--accent);border:none;color:#fff;padding:9px 14px;
  border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap;}
.stamm-stamm-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 14px;margin-bottom:6px;display:flex;align-items:flex-start;gap:8px;}
.stamm-row-info{flex:1;}
.stamm-row-name{font-weight:600;font-size:.9rem;margin-bottom:4px;}
.stamm-row-sub{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;}
.gw-mini{background:var(--surface2);border:1px solid var(--border);padding:2px 7px;
  border-radius:10px;font-size:.72rem;}
.stamm-row-actions{display:flex;gap:4px;flex-shrink:0;}
.btn-edit-k,.btn-del-k{border:1px solid var(--border);background:var(--surface2);
  color:var(--muted);border-radius:6px;padding:4px 9px;font-size:.8rem;cursor:pointer;}
.btn-edit-k:hover{border-color:var(--accent);color:var(--accent);}
.btn-del-k:hover{border-color:var(--err);color:var(--err);}
/* Kunde-Edit-Modal */
.gewerk-edit-grid{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.gewerk-edit-row{display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:var(--surface2);border-radius:8px;}
.gewerk-edit-row .gw-name{width:90px;font-size:.82rem;font-weight:600;}
.gewerk-edit-row .q-checks{display:flex;gap:10px;}
.gewerk-edit-row .q-checks label{display:flex;align-items:center;gap:3px;font-size:.78rem;cursor:pointer;}
.gewerk-edit-row .q-checks input{accent-color:var(--accent);cursor:pointer;}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;}
.modal-bg[hidden]{display:none;}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;
  width:100%;max-width:var(--max);max-height:85vh;display:flex;flex-direction:column;
  overflow:hidden;}
.modal-header{padding:16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;}
.modal-header h2{flex:1;font-size:1rem;font-weight:700;}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;
  line-height:1;padding:0 4px;}
.modal-body{padding:16px;overflow-y:auto;flex:1;}
.modal-footer{padding:14px 16px;border-top:1px solid var(--border);
  display:flex;gap:8px;flex-wrap:wrap;}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--border);cursor:pointer;}
.check-item:last-child{border-bottom:none;}
.check-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok);
  flex-shrink:0;cursor:pointer;margin-top:1px;}
.check-item label{font-size:.9rem;cursor:pointer;flex:1;}
.check-item.checked label{color:var(--muted);text-decoration:line-through;}
.modal-done-banner{background:rgba(46,204,113,.15);border:1px solid var(--ok);
  border-radius:8px;padding:10px 14px;color:var(--ok);font-weight:600;
  font-size:.88rem;margin-bottom:12px;}
.btn-primary{background:var(--accent);border:none;color:#fff;padding:10px 20px;
  border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;flex:1;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  padding:10px 16px;border-radius:8px;font-size:.9rem;cursor:pointer;}
.btn-secondary:hover{color:var(--text);}
.btn-danger{background:transparent;border:1px solid var(--err);color:var(--err);
  padding:10px 16px;border-radius:8px;font-size:.9rem;cursor:pointer;}

/* SETTINGS */
.settings-form{display:flex;flex-direction:column;gap:12px;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group label{font-size:.8rem;color:var(--muted);font-weight:600;}
.form-group input{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:9px 12px;border-radius:8px;font-size:.9rem;}
.form-group input:focus{outline:none;border-color:var(--accent);}
.settings-sep{border:none;border-top:1px solid var(--border);margin:4px 0;}
.settings-hint{font-size:.78rem;color:var(--muted);}
.test-result{font-size:.82rem;padding:6px 0;}
.test-result.ok{color:var(--ok);}
.test-result.err{color:var(--err);}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:10px 20px;border-radius:20px;font-size:.88rem;
  z-index:300;pointer-events:none;transition:opacity .3s;}
.toast.hidden{opacity:0;}

/* Footer */
footer.app{text-align:center;padding:16px;font-size:.75rem;color:var(--muted);}
</style>
</head>
<body>

<div class="app-header">
  <h1>Wartungsübersicht</h1>
  <span id="syncStatus" class="off">Nicht verbunden</span>
  <button class="icon-btn" id="settingsBtn" title="Einstellungen">⚙</button>
</div>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="plan">Quartalsplan</button>
  <button class="tab-btn" data-tab="stamm">Stammdaten</button>
</div>

<div id="tabPlan">
  <div class="plan-controls">
    <select class="year-sel" id="yearSel"></select>
    <div class="q-tabs">
      <button class="q-btn" data-q="0">Q1</button>
      <button class="q-btn" data-q="1">Q2</button>
      <button class="q-btn" data-q="2">Q3</button>
      <button class="q-btn" data-q="3">Q4</button>
    </div>
    <label class="filter-toggle">
      <input type="checkbox" id="filterOpen"> Nur offene
    </label>
  </div>
  <div class="main">
    <div id="kundenListe"></div>
  </div>
</div>

<div id="tabStamm" hidden>
  <div class="main">
    <div class="stamm-header">
      <input class="stamm-search" id="stammSearch" type="search" placeholder="Suche: Ort, Objekt…">
      <button class="btn-add-kunde" id="addKundeBtn">+ Hinzufügen</button>
    </div>
    <div id="stammListe"></div>
  </div>
</div>

<!-- Checklist Modal -->
<div class="modal-bg" id="checkModal" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Wartung</h2>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body">
      <div id="doneBanner" class="modal-done-banner" hidden>✓ Diese Wartung wurde als erledigt markiert.</div>
      <div id="checkItems"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-primary" id="markDoneBtn">Als erledigt markieren</button>
      <button class="btn-danger" id="markUndoneBtn" hidden>Zurücksetzen</button>
    </div>
  </div>
</div>

<!-- Kunde Edit Modal -->
<div class="modal-bg" id="kundeModal" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="kundeModalTitle">Kunde</h2>
      <button class="modal-close" id="kundeModalClose">×</button>
    </div>
    <div class="modal-body">
      <div class="settings-form">
        <div class="form-group">
          <label>Ort *</label>
          <input id="keOrt" placeholder="z. B. Meiningen" autocomplete="off">
        </div>
        <div class="form-group">
          <label>Objekt *</label>
          <input id="keObjekt" placeholder="z. B. Grundschule" autocomplete="off">
        </div>
        <div class="form-group">
          <label>Zusatz</label>
          <input id="keZusatz" placeholder="z. B. Am Drachenberg (optional)" autocomplete="off">
        </div>
        <div class="form-group">
          <label>Jahreswartungen (Gewerk → Quartal)</label>
          <div class="gewerk-edit-grid" id="gewerkEditGrid"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-primary" id="kundeSaveBtn">Speichern</button>
      <button class="btn-secondary" id="kundeModalCancel">Abbrechen</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-bg" id="settingsModal" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2>Einstellungen</h2>
      <button class="modal-close" id="settingsClose">×</button>
    </div>
    <div class="modal-body">
      <div class="settings-form">
        <p class="settings-hint">GitHub-Synchronisation – gleiches Daten-Repo wie die Prüflisten-App.</p>
        <div class="form-group">
          <label>GitHub-Benutzername / Organisation</label>
          <input id="ghOwner" placeholder="z. B. elektrokrieg" autocomplete="off">
        </div>
        <div class="form-group">
          <label>Daten-Repository</label>
          <input id="ghRepo" placeholder="melderpruefliste-daten" autocomplete="off">
        </div>
        <div class="form-group">
          <label>Branch</label>
          <input id="ghBranch" placeholder="main" autocomplete="off">
        </div>
        <div class="form-group">
          <label>Personal Access Token (fine-grained, Contents R/W)</label>
          <input id="ghToken" type="password" placeholder="github_pat_…" autocomplete="off">
        </div>
        <div class="test-result" id="settingsTest"></div>
        <hr class="settings-sep">
        <p class="settings-hint">Verknüpfte Apps (URL zur jeweiligen App)</p>
        <div class="form-group">
          <label>Prüflisten-App URL</label>
          <input id="pruefUrl" placeholder="../melder-pruefliste/" autocomplete="off">
        </div>
        <div class="form-group">
          <label>Regiebericht-App URL</label>
          <input id="regieUrl" placeholder="../regiebericht/" autocomplete="off">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-primary" id="settingsSave">Speichern</button>
      <button class="btn-secondary" id="settingsTestBtn">Verbindung testen</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<footer class="app">Elektro Krieg Meiningen · Wartungsübersicht v1.0.2</footer>

  var _ks=localStorage.getItem(KUNDEN_KEY);

function persistKunden(){localStorage.setItem(KUNDEN_KEY,JSON.stringify(KUNDEN));}
function slugify(s){return s.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function uniqueSlug(ort,obj,zus){
  var base=slugify(ort)+'-'+slugify(obj)+(zus?'-'+slugify(zus):'');
  if(!KUNDEN.find(function(k){return k.id===base;}))return base;
  for(var i=2;i<100;i++){var c=base+'-'+i;if(!KUNDEN.find(function(k){return k.id===c;}))return c;}
  return base+'-'+Date.now();
}

function ghIsConfigured(){return !!(ghConfig&&ghConfig.owner&&ghConfig.repo&&ghConfig.token);}
function persistGhSha(){localStorage.setItem(GH_SHA_KEY,JSON.stringify(ghSha));}

function ghHeaders(){return{'Authorization':'token '+ghConfig.token,'Content-Type':'application/json',
  'X-GitHub-Api-Version':'2022-11-28','Accept':'application/vnd.github+json'};}

function ghGetFile(path){
  var url='https://api.github.com/repos/'+ghConfig.owner+'/'+ghConfig.repo+'/contents/'+path
    +'?ref='+encodeURIComponent(ghConfig.branch||'main')+'&t='+Date.now();
  return fetch(url,{headers:ghHeaders()}).then(function(r){
    if(r.status===404)return null;
    return r.json().then(function(d){
      var text=decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));
      return{sha:d.sha,payload:JSON.parse(text)};
    });
  });
}

function ghPutFile(path,payload,message,sha){
  var body=JSON.stringify({message:message,
    content:btoa(unescape(encodeURIComponent(JSON.stringify(payload)))),
    branch:ghConfig.branch||'main'});
  if(sha)body=JSON.stringify({message:message,
    content:btoa(unescape(encodeURIComponent(JSON.stringify(payload)))),
    branch:ghConfig.branch||'main',sha:sha});
  return fetch('https://api.github.com/repos/'+ghConfig.owner+'/'+ghConfig.repo+'/contents/'+path,
    {method:'PUT',headers:ghHeaders(),body:body}).then(function(r){
      if(!r.ok)return r.json().then(function(d){var e=new Error(d.message);e.status=r.status;throw e;});
      return r.json().then(function(d){return d.content.sha;});
    });
}

function setSyncStatus(cls,text){
  var el=document.getElementById('syncStatus');
  el.className=cls;el.textContent=text;
}

var pushTimers={};
function schedulePush(slug){
  clearTimeout(pushTimers[slug]);
  pushTimers[slug]=setTimeout(function(){pushStatus(slug);},1200);
}

function mergeStatus(local,remote){
  var out=JSON.parse(JSON.stringify(local||{}));
  if(!remote)return out;
  Object.keys(remote).forEach(function(year){
    if(!out[year])out[year]={};
    Object.keys(remote[year]).forEach(function(qi){
      if(!out[year][qi])out[year][qi]={};
      Object.keys(remote[year][qi]).forEach(function(gw){
        var r=remote[year][qi][gw],l=out[year][qi][gw]||{};
        var items=(r.items||[]).map(function(v,i){return v||(l.items&&l.items[i]);});
        out[year][qi][gw]={done:r.done||l.done||false,items:items,kollege:r.kollege||l.kollege||''};
      });
    });
  });
  return out;
}

function pushStatus(slug){
  if(!ghIsConfigured())return Promise.resolve();
  var path='wartung/'+slug+'.json';
  var payload={status:state.status[slug]||{},updated:new Date().toISOString()};
  setSyncStatus('busy','Speichere …');
  function attempt(t){
    return ghPutFile(path,payload,'Wartung – '+slug,ghSha[slug]).then(function(sha){
      ghSha[slug]=sha;persistGhSha();setSyncStatus('ok','Synchron');
    }).catch(function(err){
      if(err.status===409&&t>0){
        return ghGetFile(path).then(function(res){
          ghSha[slug]=res?res.sha:null;
          if(res)payload.status=mergeStatus(payload.status,res.payload.status||{});
          return attempt(t-1);
        });
      }
      setSyncStatus('err','Sync fehlgeschlagen');
    });
  }
  return attempt(3);
}

function pullAndMerge(slug){
  if(!ghIsConfigured()){setSyncStatus('off','Nicht verbunden – nur lokal');return Promise.resolve();}
  var path='wartung/'+slug+'.json';
  setSyncStatus('busy','Synchronisiere …');
  return ghGetFile(path).then(function(res){
    if(res){
      ghSha[slug]=res.sha;
      state.status[slug]=mergeStatus(state.status[slug],res.payload.status||{});
      localStorage.setItem(ST_KEY,JSON.stringify(state.status));
    }else{ghSha[slug]=null;}
    persistGhSha();setSyncStatus('ok','Synchron');renderAll();
  }).catch(function(err){console.error(err);setSyncStatus('err','Offline / Fehler');});
}

// ── HELPERS ───────────────────────────────────────────────────
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg,cls){
  var el=document.getElementById('toast');
  el.textContent=msg;el.className='toast '+(cls||'');
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){el.className='toast hidden';},2500);
}

function getStatusGW(slug,year,qi,gw){
  return((state.status[slug]||{})[year]||{})[qi]||{};
}
function getGWStatus(slug,year,qi,gw){
  return((getStatusGW(slug,year,qi)||{})[gw])||{done:false,items:[],kollege:''};
}
function setGWStatus(slug,year,qi,gw,data){
  if(!state.status[slug])state.status[slug]={};
  if(!state.status[slug][year])state.status[slug][year]={};
  if(!state.status[slug][year][qi])state.status[slug][year][qi]={};
  state.status[slug][year][qi][gw]=data;
  localStorage.setItem(ST_KEY,JSON.stringify(state.status));
}

// ── RENDER QUARTALSPLAN ───────────────────────────────────────
function renderPlan(){
  var year=state.year,qi=state.quarter;
  // Collect due Gewerke per Kunde: current quarter + rollover from previous quarters
  function getDueGW(k){
    var due={};
    // Current quarter
    Object.keys(k.gewerke).forEach(function(gw){if(k.gewerke[gw][qi])due[gw]={rollover:false,srcQ:qi};});
    // Rollover: Jahreswartungen (not every-quarter) due in qi1<qi that are not done
    for(var qi1=0;qi1<qi;qi1++){
      Object.keys(k.gewerke).forEach(function(gw){
        if(k.gewerke[gw][qi1]&&!k.gewerke[gw].every(Boolean)){
          if(!getGWStatus(k.id,year,qi1,gw).done){
            if(!due[gw])due[gw]={rollover:true,srcQ:qi1};
          }
        }
      });
    }
    return due;
  }
  // Filter: customers with something due (this quarter OR rollover)
  var list=KUNDEN.filter(function(k){return Object.keys(getDueGW(k)).length>0;});
  if(state.filterOpen){
    list=list.filter(function(k){
      var due=getDueGW(k);
      return Object.keys(due).some(function(gw){
        return !getGWStatus(k.id,year,due[gw].srcQ,gw).done;
      });
    });
  }

  if(!list.length){
    document.getElementById('kundenListe').innerHTML=
      '<div class="empty-state"><div class="big">✓</div><div>Alle Wartungen erledigt.</div></div>';
    return;
  }

  // Group by Ort
  var byOrt={};
  list.forEach(function(k){
    if(!byOrt[k.ort])byOrt[k.ort]=[];
    byOrt[k.ort].push(k);
  });

  var html='';
  Object.keys(byOrt).sort().forEach(function(ort){
    html+='<div class="ort-group"><div class="ort-label">'+escHtml(ort)+'</div>';
    byOrt[ort].forEach(function(k){
      var due=getDueGW(k);
      var allDone=Object.keys(due).every(function(gw){return getGWStatus(k.id,year,due[gw].srcQ,gw).done;});
      var nameDisplay=escHtml(k.objekt)+(k.zusatz?'<span class="kunde-zusatz"> – '+escHtml(k.zusatz)+'</span>':'');
      html+='<div class="kunde-card'+(allDone?' all-done':'')+'" data-id="'+escHtml(k.id)+'">';
      html+='<div class="kunde-top"><span class="kunde-name">'+nameDisplay+'</span>';
      if(k.hasBmaQ){
        var pruefLink=appUrls.pruef+'?ort='+encodeURIComponent(k.ort)+'&kunde='+encodeURIComponent(k.objekt);
        html+='<a class="btn-pruef" href="'+escHtml(pruefLink)+'" target="_blank">Prüfliste →</a>';
      }
      html+='</div><div class="gewerk-badges">';
      // Sort by GEWERKE_ORDER
      var sorted=GEWERKE_ORDER.filter(function(gw){return due[gw]!==undefined;});
      sorted.forEach(function(gw){
        var info=due[gw];
        var st=getGWStatus(k.id,year,info.srcQ,gw);
        var col=GW_COLOR[gw]||'#555';
        var cls='gw-badge '+(st.done?'done':info.rollover?'offen rollover':'offen');
        var style=st.done?'background:'+col+';border-color:'+col+';'
          :'border-color:'+col+';color:'+col+';';
        var label=escHtml(gw)+(info.rollover?'<sup title="Überfällig aus Q'+(info.srcQ+1)+'">!</sup>':'');
        html+='<button class="'+cls+'" style="'+style+'"'
          +' data-kid="'+escHtml(k.id)+'" data-gw="'+escHtml(gw)+'" data-srcq="'+info.srcQ+'">'+label+'</button>';
      });
      html+='</div></div>';
    });
    html+='</div>';
  });
  document.getElementById('kundenListe').innerHTML=html;

  // Badge click → open checklist
  document.getElementById('kundenListe').querySelectorAll('.gw-badge').forEach(function(btn){
    btn.addEventListener('click',function(){
      openChecklist(btn.dataset.kid,btn.dataset.gw,parseInt(btn.dataset.srcq));
    });
  });
}

// ── RENDER STAMMDATEN ─────────────────────────────────────────
function renderStamm(){
  var q=document.getElementById('stammSearch').value.trim().toLowerCase();
  var list=KUNDEN.filter(function(k){
    return !q||(k.ort+' '+k.objekt+' '+k.zusatz).toLowerCase().indexOf(q)>=0;
  });
  var byOrt={};
  list.forEach(function(k){if(!byOrt[k.ort])byOrt[k.ort]=[];byOrt[k.ort].push(k);});
  var html='';
  Object.keys(byOrt).sort().forEach(function(ort){
    html+='<div class="ort-group"><div class="ort-label">'+escHtml(ort)+'</div>';
    byOrt[ort].forEach(function(k){
      html+='<div class="stamm-stamm-row">';
      html+='<div class="stamm-row-info">';
      html+='<div class="stamm-row-name">'+escHtml(k.objekt)+(k.zusatz?' <span style="color:var(--muted);font-size:.82rem;">'+escHtml(k.zusatz)+'</span>':'')+'</div>';
      html+='<div class="stamm-row-sub">';
      var gws=GEWERKE_ORDER.filter(function(gw){return k.gewerke[gw];});
      gws.forEach(function(gw){
        var qs=k.gewerke[gw].map(function(v,i){return v?'Q'+(i+1):null;}).filter(Boolean).join(' ');
        html+='<span class="gw-mini">'+escHtml(gw)+(qs?' ('+escHtml(qs)+')':'')+'</span>';
      });
      if(!gws.length)html+='<span style="color:var(--muted);font-size:.78rem;">Keine Jahreswartung</span>';
      html+='</div></div>';
      html+='<div class="stamm-row-actions">'
        +'<button class="btn-edit-k" data-id="'+escHtml(k.id)+'">✏</button>'
        +'<button class="btn-del-k" data-id="'+escHtml(k.id)+'">✕</button>'
        +'</div>';
      html+='</div>';
    });
    html+='</div>';
  });
  if(!html)html='<div class="empty-state"><div>Keine Treffer.</div></div>';
  document.getElementById('stammListe').innerHTML=html;
  // Buttons
  document.getElementById('stammListe').querySelectorAll('.btn-edit-k').forEach(function(btn){
    btn.addEventListener('click',function(){openKundeModal(btn.dataset.id);});
  });
  document.getElementById('stammListe').querySelectorAll('.btn-del-k').forEach(function(btn){
    btn.addEventListener('click',function(){deleteKunde(btn.dataset.id);});
  });
}

// ── KUNDE CRUD ────────────────────────────────────────────────
var _editKundeId=null;
function buildGewerkGrid(gewerke){
  var html='';
  GEWERKE_ORDER.forEach(function(gw){
    var q=gewerke[gw]||[false,false,false,false];
    html+='<div class="gewerk-edit-row"><span class="gw-name">'+escHtml(gw)+'</span><div class="q-checks">';
    [0,1,2,3].forEach(function(i){
      html+='<label><input type="checkbox" data-gw="'+escHtml(gw)+'" data-qi="'+i+'"'+(q[i]?' checked':'')+'>Q'+(i+1)+'</label>';
    });
    html+='</div></div>';
  });
  return html;
}
function openKundeModal(id){
  _editKundeId=id||null;
  var k=id?KUNDEN.find(function(x){return x.id===id;}):null;
  document.getElementById('kundeModalTitle').textContent=k?'Kunde bearbeiten':'Neuer Kunde';
  document.getElementById('keOrt').value=k?k.ort:'';
  document.getElementById('keObjekt').value=k?k.objekt:'';
  document.getElementById('keZusatz').value=k?k.zusatz:'';
  document.getElementById('gewerkEditGrid').innerHTML=buildGewerkGrid(k?k.gewerke:{});
  document.getElementById('kundeModal').hidden=false;
}
function readGewerkFromModal(){
  var gewerke={};
  document.getElementById('gewerkEditGrid').querySelectorAll('input[type=checkbox]').forEach(function(cb){
    var gw=cb.dataset.gw,qi=parseInt(cb.dataset.qi,10);
    if(!gewerke[gw])gewerke[gw]=[false,false,false,false];
    gewerke[gw][qi]=cb.checked;
  });
  // Remove Gewerke with no quarter set
  Object.keys(gewerke).forEach(function(gw){if(!gewerke[gw].some(Boolean))delete gewerke[gw];});
  return gewerke;
}
function deleteKunde(id){
  if(!confirm('Kunde wirklich löschen?\nAlle gespeicherten Wartungsdaten für diesen Kunden bleiben in der App gespeichert, können aber nicht mehr angezeigt werden.'))return;
  KUNDEN=KUNDEN.filter(function(k){return k.id!==id;});
  persistKunden();
  renderStamm();
  toast('Kunde gelöscht.');
}
document.getElementById('addKundeBtn').addEventListener('click',function(){openKundeModal(null);});
document.getElementById('kundeModalClose').addEventListener('click',function(){document.getElementById('kundeModal').hidden=true;});
document.getElementById('kundeModalCancel').addEventListener('click',function(){document.getElementById('kundeModal').hidden=true;});
document.getElementById('kundeModal').addEventListener('click',function(e){if(e.target===this)this.hidden=true;});
document.getElementById('kundeSaveBtn').addEventListener('click',function(){
  var ort=document.getElementById('keOrt').value.trim();
  var obj=document.getElementById('keObjekt').value.trim();
  var zus=document.getElementById('keZusatz').value.trim();
  if(!ort||!obj){toast('Ort und Objekt sind Pflichtfelder.','');return;}
  var gewerke=readGewerkFromModal();
  if(_editKundeId){
    var k=KUNDEN.find(function(x){return x.id===_editKundeId;});
    if(k){k.ort=ort;k.objekt=obj;k.zusatz=zus;k.gewerke=gewerke;}
  }else{
    KUNDEN.push({id:uniqueSlug(ort,obj,zus),ort:ort,objekt:obj,zusatz:zus,gewerke:gewerke});
  }
  KUNDEN.sort(function(a,b){return a.ort.localeCompare(b.ort,'de')||a.objekt.localeCompare(b.objekt,'de');});
  persistKunden();
  document.getElementById('kundeModal').hidden=true;
  renderAll();
  toast(_editKundeId?'Gespeichert.':'Kunde hinzugefügt.','ok');
});

function renderAll(){
  if(state.tab==='plan')renderPlan();
  else renderStamm();
}

// ── CHECKLIST MODAL ───────────────────────────────────────────
function openChecklist(slug,gw,srcQ){
  var kunde=KUNDEN.find(function(k){return k.id===slug;});
  if(!kunde)return;
  var resolvedQ=(srcQ!==undefined&&!isNaN(srcQ))?srcQ:state.quarter;
  state.modal={slug:slug,gw:gw,year:state.year,qi:resolvedQ};
  var st=getGWStatus(slug,state.year,resolvedQ,gw);
  var items=CHECKLISTS[gw]||['Keine Checkliste konfiguriert'];

  var title=gw+'-Wartung · '+kunde.ort+' – '+kunde.objekt;
  if(kunde.zusatz)title+=' ('+kunde.zusatz+')';
  document.getElementById('modalTitle').textContent=title;

  // Items
  var html='';
  items.forEach(function(item,i){
    var checked=st.items&&st.items[i];
    html+='<div class="check-item'+(checked?' checked':'')+'" data-idx="'+i+'">'
      +'<input type="checkbox" id="ci'+i+'"'+(checked?' checked':'')+' '+(st.done?' disabled':'')+' data-idx="'+i+'">'
      +'<label for="ci'+i+'">'+escHtml(item)+'</label></div>';
  });
  document.getElementById('checkItems').innerHTML=html;

  var doneBanner=document.getElementById('doneBanner');
  doneBanner.hidden=!st.done;
  document.getElementById('markDoneBtn').hidden=st.done;
  document.getElementById('markUndoneBtn').hidden=!st.done;

  document.getElementById('checkModal').hidden=false;
  document.body.style.overflow='hidden';

  // Checkbox events
  document.getElementById('checkItems').querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.addEventListener('change',function(){
      var idx=parseInt(this.dataset.idx,10);
      var s=getGWStatus(state.modal.slug,state.modal.year,state.modal.qi,state.modal.gw);
      var newItems=(CHECKLISTS[state.modal.gw]||[]).map(function(_,i){return i===idx?cb.checked:(s.items&&s.items[i])||false;});
      setGWStatus(state.modal.slug,state.modal.year,state.modal.qi,state.modal.gw,
        {done:s.done,items:newItems,kollege:s.kollege||''});
      localStorage.setItem(ST_KEY,JSON.stringify(state.status));
      schedulePush(state.modal.slug);
      var row=cb.closest('.check-item');
      if(cb.checked)row.classList.add('checked');else row.classList.remove('checked');
    });
  });

  // Pull latest from GitHub
  pullAndMerge(slug).then(function(){
    // Re-render modal items with fresh data
    var s2=getGWStatus(slug,state.year,state.quarter,gw);
    document.getElementById('checkItems').querySelectorAll('.check-item').forEach(function(row){
      var idx=parseInt(row.dataset.idx,10);
      var cb=row.querySelector('input');
      var v=s2.items&&s2.items[idx];
      if(v){row.classList.add('checked');if(cb)cb.checked=true;}
    });
    if(s2.done){
      doneBanner.hidden=false;
      document.getElementById('markDoneBtn').hidden=true;
      document.getElementById('markUndoneBtn').hidden=false;
    }
  });
}

function closeModal(){
  document.getElementById('checkModal').hidden=true;
  document.body.style.overflow='';
  state.modal=null;
  renderAll();
}

document.getElementById('modalClose').addEventListener('click',closeModal);
document.getElementById('checkModal').addEventListener('click',function(e){
  if(e.target===this)closeModal();
});

document.getElementById('markDoneBtn').addEventListener('click',function(){
  if(!state.modal)return;
  var m=state.modal;
  var items=(CHECKLISTS[m.gw]||[]).map(function(){return true;});
  setGWStatus(m.slug,m.year,m.qi,m.gw,{done:true,items:items,kollege:''});
  localStorage.setItem(ST_KEY,JSON.stringify(state.status));
  schedulePush(m.slug);
  document.getElementById('doneBanner').hidden=false;
  document.getElementById('markDoneBtn').hidden=true;
  document.getElementById('markUndoneBtn').hidden=false;
  document.getElementById('checkItems').querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.checked=true;cb.disabled=true;cb.closest('.check-item').classList.add('checked');
  });
  toast('✓ '+m.gw+'-Wartung als erledigt markiert.','ok');
});

document.getElementById('markUndoneBtn').addEventListener('click',function(){
  if(!state.modal)return;
  var m=state.modal;
  setGWStatus(m.slug,m.year,m.qi,m.gw,{done:false,items:[],kollege:''});
  localStorage.setItem(ST_KEY,JSON.stringify(state.status));
  schedulePush(m.slug);
  document.getElementById('doneBanner').hidden=true;
  document.getElementById('markDoneBtn').hidden=false;
  document.getElementById('markUndoneBtn').hidden=true;
  document.getElementById('checkItems').querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.checked=false;cb.disabled=false;cb.closest('.check-item').classList.remove('checked');
  });
  toast('Wartung zurückgesetzt.');
});

// ── TABS ──────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    state.tab=btn.dataset.tab;
    document.getElementById('tabPlan').hidden=state.tab!=='plan';
    document.getElementById('tabStamm').hidden=state.tab!=='stamm';
    renderAll();
  });
});

// ── YEAR / QUARTER ────────────────────────────────────────────
(function(){
  var sel=document.getElementById('yearSel');
  var curY=new Date().getFullYear();
  for(var y=curY-1;y<=curY+2;y++){
    var opt=document.createElement('option');
    opt.value=y;opt.textContent=y;
    if(y===state.year)opt.selected=true;
    sel.appendChild(opt);
  }
  sel.addEventListener('change',function(){state.year=parseInt(this.value,10);renderAll();});
})();

document.querySelectorAll('.q-btn').forEach(function(btn){
  if(parseInt(btn.dataset.q,10)===state.quarter)btn.classList.add('active');
  btn.addEventListener('click',function(){
    document.querySelectorAll('.q-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    state.quarter=parseInt(btn.dataset.q,10);
    renderAll();
  });
});

document.getElementById('filterOpen').addEventListener('change',function(){
  state.filterOpen=this.checked;renderAll();
});

// ── STAMM SEARCH ──────────────────────────────────────────────
document.getElementById('stammSearch').addEventListener('input',function(){renderStamm();});

// ── SETTINGS ─────────────────────────────────────────────────
document.getElementById('settingsBtn').addEventListener('click',function(){
  if(ghConfig){
    document.getElementById('ghOwner').value=ghConfig.owner||'';
    document.getElementById('ghRepo').value=ghConfig.repo||'';
    document.getElementById('ghBranch').value=ghConfig.branch||'main';
    document.getElementById('ghToken').value=ghConfig.token||'';
  }
  document.getElementById('pruefUrl').value=appUrls.pruef;
  document.getElementById('regieUrl').value=appUrls.regie;
  document.getElementById('settingsModal').hidden=false;
});
document.getElementById('settingsClose').addEventListener('click',function(){
  document.getElementById('settingsModal').hidden=true;
});
document.getElementById('settingsModal').addEventListener('click',function(e){
  if(e.target===this)this.hidden=true;
});
document.getElementById('settingsSave').addEventListener('click',function(){
  var o=document.getElementById('ghOwner').value.trim(),
      r=document.getElementById('ghRepo').value.trim(),
      b=document.getElementById('ghBranch').value.trim()||'main',
      t=document.getElementById('ghToken').value.trim();
  if(o&&r&&t){ghConfig={owner:o,repo:r,branch:b,token:t};localStorage.setItem(GH_KEY,JSON.stringify(ghConfig));}
  appUrls.pruef=document.getElementById('pruefUrl').value.trim()||'../melder-pruefliste/';
  appUrls.regie=document.getElementById('regieUrl').value.trim()||'../regiebericht/';
  localStorage.setItem(URL_KEY,JSON.stringify(appUrls));
  document.getElementById('settingsModal').hidden=true;
  toast('Einstellungen gespeichert.','ok');
  setSyncStatus(ghIsConfigured()?'ok':'off',ghIsConfigured()?'Synchron':'Nicht verbunden');
  renderAll();
});
document.getElementById('settingsTestBtn').addEventListener('click',function(){
  var o=document.getElementById('ghOwner').value.trim(),r=document.getElementById('ghRepo').value.trim(),
      b=document.getElementById('ghBranch').value.trim()||'main',t=document.getElementById('ghToken').value.trim();
  var res=document.getElementById('settingsTest');
  if(!o||!r||!t){res.textContent='Bitte alle Felder ausfüllen.';res.className='test-result err';return;}
  res.textContent='Verbindung wird geprüft …';res.className='test-result';
  var tmp={owner:o,repo:r,branch:b,token:t};
  var oldCfg=ghConfig;ghConfig=tmp;
  ghGetFile('wartung/.keep').then(function(){
    res.textContent='✓ Verbindung erfolgreich.';res.className='test-result ok';
  }).catch(function(err){
    res.textContent='✗ Fehler: '+err.message;res.className='test-result err';
  }).finally(function(){ghConfig=oldCfg;});
});

// ── SERVICE WORKER ────────────────────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(function(){
    navigator.serviceWorker.addEventListener('message',function(e){
      if(e.data&&e.data.type==='UPDATE_AVAILABLE'){
        if(confirm('Eine neue Version der App ist verfügbar. Jetzt neu laden?'))location.reload();
      }
    });
  });
}

// ── INIT ──────────────────────────────────────────────────────
setSyncStatus(ghIsConfigured()?'ok':'off',ghIsConfigured()?'Synchron':'Nicht verbunden');
renderAll();
